name: Scrape Oxley forecasts

on:
  push:
    branches: [main]
    paths: ["scraper/**", ".github/workflows/**"]
  workflow_dispatch:
  schedule:
    - cron: "47 */3 * * *"   # every 3 hours

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install requests==2.32.3 playwright==1.47.0 beautifulsoup4==4.12.3
          python -m playwright install --with-deps chromium
      - name: Scrape
        run: python scraper/scrape.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update forecasts $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
